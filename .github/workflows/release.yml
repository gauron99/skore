name: Release APK

# Attaches an installable APK to a GitHub Release so it can be downloaded
# straight from the phone's browser (public repo — no login needed).
#
# Every push to main that changes the app ships: analyze, test, build a
# signed APK, then create the tag and the release on that commit. The
# version is the highest vX.Y.Z tag plus one patch. For a minor or major
# bump, run this workflow from the Actions tab and give it a version.
#
# The APK is a --release build signed with the stable keystore from repo
# secrets (scripts/setup-signing.sh). Android only installs an update if
# the signing cert matches the app already on the phone; a missing key
# used to fall back to the runner debug keystore, which is a new cert
# every run and showed "Something went wrong" on the phone.
on:
  push:
    branches: [main]
    # Only changes that end up in the APK make a release.
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z). Empty means next patch.
        required: false
        type: string

permissions:
  contents: write

# One release at a time, so two quick pushes cannot claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Releases come from main only, also when started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release notes list the commits since the
      # previous tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Android Gradle Plugin declared by the Flutter template requires
      # JDK 17+. setup-java also caches ~/.gradle via cache: 'gradle'.
      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.44.x stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # A failing check stops the release before anything is tagged.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Pick the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' |
              sed 's#.*refs/tags/v##' | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              echo "::error::No vX.Y.Z tag yet. Run this workflow with a version."
              exit 1
            fi
            IFS=. read -r major minor patch <<< "$latest"
            version="$major.$minor.$((patch + 1))"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' is not X.Y.Z."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "Releasing v$version"

      # Commit subjects since the previous tag. GitHub's generated notes
      # only list merged PRs, and main gets direct pushes.
      - name: Write release notes
        run: |
          scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Restore the stable release keystore from secrets (set once via
      # scripts/setup-signing.sh) so every release carries the SAME
      # signature. Android only installs an update if this cert matches
      # the app already on the phone. Missing secrets fail the job; do
      # not fall back to the runner debug keystore (a new cert every run).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing secrets. Run ./scripts/setup-signing.sh so releases keep the same cert and the phone can update in place."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/skore-release.jks
          {
            echo "storeFile=skore-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # versionName comes from the tag, versionCode from the ever-increasing
      # workflow run number — so every release is guaranteed to register as
      # an update on the phone without anyone touching pubspec.yaml.
      # One APK for phones (arm64). Not --split-per-abi: that would publish
      # three files. Fat APKs with every ABI were ~50MB and the phone
      # installer often failed them after Play Protect.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --build-name="${TAG#v}" --build-number="${{ github.run_number }}"

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          src=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$src" ]; then
            src=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          fi
          cp "$src" "dist/skore-$TAG.apk"
          ls -la dist/

      # Creates the tag on this commit together with the release. A tag
      # made with the workflow token starts no other workflow, so this
      # cannot loop.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/skore-*.apk
